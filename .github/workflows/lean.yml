name: lean

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "TheoremLibrary/**"
      - "Mutate.lean"
      - "reports/**"
      - "DomainScaling/**"
      - "TheoremLibrary.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/**"
      - "*.md"
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-proof:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve documentation comparison base
        id: docs_base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then base="HEAD^"; fi
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi
      - name: Run changed-file documentation and artifact hygiene
        run: python scripts/docs_hygiene.py --changed-since '${{ steps.docs_base.outputs.sha }}'
      - name: Run documentation hygiene regression tests
        run: python scripts/test_docs_hygiene.py
      - name: Select changed living Markdown
        id: docs_files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/docs_hygiene.py --changed-since '${{ steps.docs_base.outputs.sha }}' --list-living-docs > "$RUNNER_TEMP/changed-living-docs.txt"
          if [[ -s "$RUNNER_TEMP/changed-living-docs.txt" ]]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Markdown style (pinned markdownlint-cli2)
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          npx --yes markdownlint-cli2@0.18.1 --config .markdownlint-cli2.yaml "${docs[@]}"
      - name: Install pinned lychee
        if: steps.docs_files.outputs.any == 'true'
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          lycheeVersion: v0.20.1
          args: --version
          failIfEmpty: false
      - name: Prove lychee rejects a broken local link
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/theorem-library-broken-link.md"
          printf '%s\n' '[broken](missing-local-target.md)' > "$fixture"
          if lychee --offline --no-progress --include-fragments --root-dir "$RUNNER_TEMP" "$fixture"; then
            echo 'lychee unexpectedly accepted a broken local link' >&2
            exit 1
          fi
      - name: Check actual relative links in changed living Markdown
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          lychee --offline --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${docs[@]}"

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          leanchecker: false
          nanoda: false
          axiom-audit: false

      - name: Fetch required Mathlib cache closure
        run: bash scripts/bootstrap_mathlib.sh

      - name: Build theorem library
        run: lake build TheoremLibrary

      - name: Independently validate compiled proofs
        run: bash scripts/validate_formal.sh
