name: lean

on:
  push:
    branches: [main]
    paths:
      - "DomainScaling/**"
      - "TheoremLibrary.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "DomainScaling/**"
      - "TheoremLibrary.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-proof:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          leanchecker: false
          nanoda: false
          axiom-audit: false

      - name: Fetch required Mathlib cache closure
        run: bash scripts/bootstrap_mathlib.sh

      - name: Build theorem library
        run: lake build TheoremLibrary

      - name: Independently validate compiled proofs
        run: bash scripts/validate_formal.sh
