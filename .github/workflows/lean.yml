name: lean

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "TheoremLibrary/**"
      - "Mutate.lean"
      - "reports/**"
      - "docs/applicability/**"
      - "DomainScaling/**"
      - "TheoremLibrary.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/**"
      - "*.md"
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/lean.yml"
  workflow_dispatch:
    inputs:
      retain_proof_candidate:
        description: Retain and attest a proof candidate built from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-proof:
    runs-on: ubuntu-latest
    outputs:
      proof_artifact: ${{ steps.proof_stage.outputs.name }}
    env:
      LEAN_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve documentation comparison base
        id: docs_base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then base="HEAD^"; fi
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi
      - name: Run changed-file documentation and artifact hygiene
        run: python scripts/docs_hygiene.py --changed-since '${{ steps.docs_base.outputs.sha }}'
      - name: Run documentation and script regression tests
        run: |
          python scripts/test_docs_hygiene.py
          python scripts/test_formal_scripts.py
          python scripts/test_proof_candidate.py
      - name: Select changed living Markdown
        id: docs_files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/docs_hygiene.py --changed-since '${{ steps.docs_base.outputs.sha }}' --list-living-docs > "$RUNNER_TEMP/changed-living-docs.txt"
          if [[ -s "$RUNNER_TEMP/changed-living-docs.txt" ]]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Markdown style (pinned markdownlint-cli2)
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          npx --yes markdownlint-cli2@0.18.1 --config .markdownlint-cli2.yaml "${docs[@]}"
      - name: Install pinned lychee
        if: steps.docs_files.outputs.any == 'true'
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          lycheeVersion: v0.20.1
          args: --version
          failIfEmpty: false
      - name: Prove lychee rejects a broken local link
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/theorem-library-broken-link.md"
          printf '%s\n' '[broken](missing-local-target.md)' > "$fixture"
          if lychee --offline --no-progress --include-fragments --root-dir "$RUNNER_TEMP" "$fixture"; then
            echo 'lychee unexpectedly accepted a broken local link' >&2
            exit 1
          fi
      - name: Check actual relative links in changed living Markdown
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          lychee --offline --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${docs[@]}"

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          leanchecker: false
          nanoda: false
          axiom-audit: false

      - name: Fetch required Mathlib cache closure
        run: bash scripts/bootstrap_mathlib.sh

      - name: Build theorem library
        run: lake build TheoremLibrary

      - name: Independently validate compiled proofs
        env:
          THEOREM_REFERENCE_BASE: ${{ steps.docs_base.outputs.sha }}
        run: bash scripts/validate_formal.sh

      - name: Stage the checked proof candidate
        id: proof_stage
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && inputs.retain_proof_candidate)
        run: |
          python scripts/stage_proof_candidate.py \
            --source-sha "$GITHUB_SHA" \
            --lean-version "$(lake env lean --version)" \
            --output "$RUNNER_TEMP/theorem-proof.tar.gz"
          printf 'name=theorem-proof-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Retain proof candidate from an explicit main run
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_proof_candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proof_stage.outputs.name }}
          path: ${{ runner.temp }}/theorem-proof.tar.gz
          if-no-files-found: error

  attest-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_proof_candidate
    needs: formal-proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.formal-proof.outputs.proof_artifact }}
      - name: Attest the exact checked proof bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: theorem-proof.tar.gz
